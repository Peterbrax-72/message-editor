<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Messages</h1>
            <div class="folder-tabs">
                <button class="folder-btn active" data-folder="inbox">Inbox</button>
                <button class="folder-btn" data-folder="outbox">Sent</button>
                <button class="folder-btn" data-folder="draft">Drafts</button>
            </div>
        </header>

        <main>
            <section class="editor-panel">
                <h2 id="editor-title">New message</h2>
                <form id="message-form" autocomplete="off">
                    <input type="hidden" id="edit-id" value="">

                    <div class="form-group">
                        <label for="recipient">To</label>
                        <input type="text" id="recipient" list="contact-list"
                               placeholder="Name or phone number" required>
                        <datalist id="contact-list"></datalist>
                        <div id="recent-contacts" class="chips"></div>
                    </div>

                    <div class="form-group">
                        <label for="body">Message</label>
                        <textarea id="body" rows="5" placeholder="Type a message..." required></textarea>
                        <div class="counter"><span id="char-count">0</span> characters</div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="send-date">Date</label>
                            <input type="date" id="send-date" required>
                        </div>
                        <div class="form-group">
                            <label for="send-time">Time</label>
                            <input type="time" id="send-time" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="folder-select">Save to</label>
                        <select id="folder-select">
                            <option value="draft">Drafts</option>
                            <option value="outbox">Sent (Outbox)</option>
                            <option value="inbox">Inbox</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="save-btn">Save</button>
                        <button type="button" id="cancel-btn" class="secondary">Cancel</button>
                    </div>
                </form>
            </section>

            <section class="message-list-panel">
                <h2 id="list-title">Inbox</h2>
                <div id="message-list" class="message-list"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
