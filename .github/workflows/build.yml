name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare web assets
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/

      - name: Convert web assets to APK
        uses: darkshredder/web-to-app-action@main  # Use @main, not @v2
        with:
          build-folder-path: "dist"
          app-name: "Messages"
          output-folder-path: "apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messages-APK
          path: apk/