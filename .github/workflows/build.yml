name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare web assets
        run: |
          echo "Copying static files to dist folder..."
          mkdir -p dist
          cp index.html style.css script.js dist/

      - name: Convert web assets to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "dist"
          app-name: "MessageEditor"
          output-folder-path: "apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessageEditor-APK
          path: apk/
