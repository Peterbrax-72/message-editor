name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (retry on network errors)
        run: |
          for i in 1 2 3; do
            ./gradlew :app:assembleDebug --stacktrace && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-APK
          path: app/build/outputs/apk/debug/app-debug.apk
