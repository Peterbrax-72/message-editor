name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK from web assets
        uses: ni554n/apk-builder-action@v2
        with:
          app-name: "Messages"
          web-assets-path: "."
          output-path: "apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-APK
          path: apk/